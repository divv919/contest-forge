[project]
name = "backend"
version = "0.1.0"
description = "The backend for contest forge, A competitve programming platform, including features like contest creation, participation, creation and solving of problems"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "fastapi-cli",
    "fastapi-cloud-cli",
    "sqlmodel",
    "sqlalchemy",
    "alembic",
    "pg8000",
    "pydantic-settings",
    "pydantic-extra-types",
    "email-validator",
    "python-dotenv",
    "python-multipart",
    "httpx",
    "pyjwt",
    "pwdlib",
    "argon2-cffi",
    "sentry-sdk",
    "jinja2",
    "uvicorn",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio==0.23.0",
    "ruff",
]
[tool.ruff]
line-length = 100
extend-exclude= [
    "versions",
    "full-py-boilerplate.py",
]

[tool.ruff.lint]
extend-select = ["E501", "F" , "I", "B", "C4" , "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"