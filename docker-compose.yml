x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./backend/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./backend/judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  db:
    image: postgres:16.2
    env_file: ./backend/judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  db-test:
    image: postgres:16.2
    profiles:
      - test
    env_file: ./backend/.env.test
    <<: *default-logging
    restart: always
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis:
    image: redis:7.2.4
    command:
      - "bash"
      - "-c"
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    env_file: ./backend/judge0.conf
    <<: *default-logging
    restart: always

  migrate-dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: no
    env_file:
      - ./backend/.env
  migrate-test:
    profiles:
      - test
    env_file:
      - ./backend/.env.test
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db-test:
        condition: service_healthy
    restart: no

  fastapi-starter:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app:ro
      - /app/.venv
    ports:
      - 80:80
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost/health').getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    env_file:
      - .backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles:
      - dev
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:80
      INTERNAL_API_BASE_URL: http://fastapi-starter:80
    depends_on:
      fastapi-starter:
        condition: service_healthy

  seed-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles:
      - dev
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
    working_dir: /
    command: ["app/.venv/bin/python", "-m", "app.scripts.seed"]
    env_file: ./backend/.env

  seed-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles:
      - test
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    working_dir: /
    command: ["app/.venv/bin/python", "-m", "app.scripts.seed"]
    env_file: ./backend/.env.test

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles:
      - test
    command: ["uv", "run", "pytest"]
    env_file: ./backend/.env.test
    depends_on:
      seed-test:
        condition: service_completed_successfully
volumes:
  data: